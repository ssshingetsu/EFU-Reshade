name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          $name = "EndfieldUncensored-${{ github.ref_name }}"
          New-Item -ItemType Directory -Path dist/$name | Out-Null
          Copy-Item build/Release/EndfieldUncensored.addon64, README.md, LICENSE.txt dist/$name/
          Compress-Archive -Path dist/$name/* -DestinationPath dist/$name.zip
          Copy-Item build/Release/EndfieldUncensored.addon64 dist/

      - uses: actions/upload-artifact@v4
        with:
          name: EndfieldUncensored
          path: dist/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/EndfieldUncensored.addon64
